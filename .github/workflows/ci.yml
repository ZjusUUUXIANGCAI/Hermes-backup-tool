name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is 26.04, where setup-python has no builds for older
        # interpreters; 22.04 still ships 3.8 through 3.13.
        os: [ubuntu-22.04, windows-latest]
        python: ["3.9", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-22.04
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: install optional crypto (v2 path)
        run: python -m pip install --disable-pip-version-check cryptography
      - name: crypto v2 selftest
        run: python hermes_backup.py selftest
      - name: cli smoke
        run: python hermes_backup.py --help
